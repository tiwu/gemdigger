name: Build, Test & Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main, '**']
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install frontend deps
        run: npm ci
      - name: Run frontend unit + integration tests
        run: npm test
      - name: Install server deps
        run: npm ci
        working-directory: server
      - name: Run server tests
        run: npm test
        working-directory: server

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Set Base Path
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "VITE_BASE_PATH=/${{ github.event.repository.name }}/" >> $GITHUB_ENV
          else
            # Use head_ref for PRs, or ref_name for others
            BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
            echo "VITE_BASE_PATH=/${{ github.event.repository.name }}/$BRANCH_NAME/" >> $GITHUB_ENV
          fi
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE_PATH: ${{ env.VITE_BASE_PATH }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-main:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Main to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-branch:
    if: github.event_name == 'pull_request' && github.head_ref != 'main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: dist-artifact
      - name: Extract build artifact
        run: |
          mkdir dist
          tar -xf dist-artifact/artifact.tar -C dist
      - name: Add .nojekyll
        run: touch dist/.nojekyll
      - name: Deploy Branch to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          target-folder: ${{ github.head_ref || github.ref_name }}
          branch: gh-pages
      - name: Add deployment URL to summary
        run: |
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/$BRANCH_NAME/"
          echo "### Deployment Successful! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "Your test version is available at: [$URL]($URL)" >> $GITHUB_STEP_SUMMARY
