name: Build, Test & Deploy

on:
  push:
    branches: [main, '**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install frontend deps
        run: npm ci
      - name: Run frontend unit + integration tests
        run: npm test
      - name: Install server deps
        run: npm ci
        working-directory: server
      - name: Run server tests
        run: npm test
        working-directory: server

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Set Base Path
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "VITE_BASE_PATH=/${{ github.event.repository.name }}/" >> $GITHUB_ENV
          else
            # Extract branch name and use it as base path
            BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/})
            echo "VITE_BASE_PATH=/${{ github.event.repository.name }}/$BRANCH_NAME/" >> $GITHUB_ENV
          fi
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE_PATH: ${{ env.VITE_BASE_PATH }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Main to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deploy Branch to GitHub Pages
        if: github.ref != 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          target-folder: ${{ github.ref_name }}
          branch: gh-pages
