name: Build, Test & Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main, '**']
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install frontend deps
        run: npm ci
      - name: Run frontend lint
        run: npm run lint
      - name: Run frontend unit + integration tests
        run: npm test
      - name: Install server deps
        run: npm ci
        working-directory: server
      - name: Run server lint
        run: npm run lint
        working-directory: server
      - name: Run server tests
        run: npm test
        working-directory: server

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Set Base Path
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "VITE_BASE_PATH=/${{ github.event.repository.name }}/" >> $GITHUB_ENV
          else
            # Use head_ref for PRs, or ref_name for others
            BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
            echo "VITE_BASE_PATH=/${{ github.event.repository.name }}/$BRANCH_NAME/" >> $GITHUB_ENV
          fi
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE_PATH: ${{ env.VITE_BASE_PATH }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy-main:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: dist-artifact
      - name: Extract build artifact
        run: |
          mkdir dist
          tar -xf dist-artifact/artifact.tar -C dist
      - name: Checkout gh-pages branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages-repo
      - name: Deploy Main to gh-pages root
        run: |
          # Configure Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          cd gh-pages-repo
          
          # Delete root files
          find . -maxdepth 1 -type f -not -name ".git" -not -name ".nojekyll" -delete
          
          # Delete main app assets dir if it exists
          if [ -d "assets" ]; then rm -rf assets; fi
          
          # Copy new files from dist to gh-pages-repo root
          cp -r ../dist/* .
          touch .nojekyll
          
          # Commit and push
          git add -A
          if git diff-index --quiet HEAD --; then
            echo "No changes to commit"
          else
            git commit -m "Deploy main to gh-pages root"
            git push origin gh-pages
          fi

  deploy-branch:
    if: github.event_name == 'pull_request' && github.head_ref != 'main' && !startsWith(github.head_ref, 'dependabot/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: dist-artifact
      - name: Extract build artifact
        run: |
          mkdir dist
          tar -xf dist-artifact/artifact.tar -C dist
      - name: Checkout gh-pages branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages-repo
      - name: Deploy Branch to gh-pages subdirectory
        run: |
          # Configure Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
          TARGET_DIR="gh-pages-repo/$BRANCH_NAME"
          
          # Clear old branch directory if it exists, then recreate
          rm -rf "$TARGET_DIR"
          mkdir -p "$TARGET_DIR"
          
          # Copy new build files to branch directory
          cp -r dist/* "$TARGET_DIR/"
          touch gh-pages-repo/.nojekyll
          
          cd gh-pages-repo
          git add -A
          if git diff-index --quiet HEAD --; then
            echo "No changes to commit"
          else
            git commit -m "Deploy branch $BRANCH_NAME to subdirectory"
            git push origin gh-pages
          fi
      - name: Add deployment URL to summary
        run: |
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/$BRANCH_NAME/"
          echo "### Deployment Successful! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "Your test version is available at: [$URL]($URL)" >> $GITHUB_STEP_SUMMARY
