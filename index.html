<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digger Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            border: 2px solid #fff;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game Configuration
        const TILE_SIZE = 32;
        const GRID_WIDTH = 20;
        const GRID_HEIGHT = 15;

        canvas.width = GRID_WIDTH * TILE_SIZE;
        canvas.height = GRID_HEIGHT * TILE_SIZE;

        // Game State
        const grid = [];
        const tiles = [];

        class Tile {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type; // 'dirt', 'empty', 'stone'
                this.isDrillable = true;
            }
        }

        // Initialize Grid
        function initGrid() {
            for (let y = 0; y < GRID_HEIGHT; y++) {
                grid[y] = [];
                for (let x = 0; x < GRID_WIDTH; x++) {
                    const tile = new Tile(x, y, 'dirt');
                    grid[y][x] = tile;
                    tiles.push(tile);
                }
            }
        }

        // Procedural Generation: Random Walk
        function generateCave() {
            for (let y = 0; y < GRID_HEIGHT; y++) {
                grid[y] = [];
                for (let x = 0; x < GRID_WIDTH; x++) {
                    grid[y][x] = new Tile(x, y, 'dirt');
                }
            }

            // Simple Random Walk to "carve" the cave
            let currX = Math.floor(GRID_WIDTH / 2);
            let currY = Math.floor(GRID_HEIGHT / 2);
            grid[currY][currX].type = 'empty';
            grid[currY][currX].isDrillable = false;

            for (let i = 0; i < 200; i++) {
                const directions = [[0, 1], [0, -1], [1, 0], [-1, 0]];
                const [dx, dy] = directions[Math.floor(Math.random() * directions.length)];
                const nextX = currX + dx;
                const nextY = currY + dy;

                if (nextX >= 0 && nextX < GRID_WIDTH && nextY >= 0 && nextY < GRID_HEIGHT) {
                    grid[nextY][nextX].type = 'empty';
                    grid[nextY][nextX].isDrillable = false;
                    currX = nextX;
                    currY = nextY;
                }
            }
        }

        // Rendering logic
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let y = 0; y < GRID_HEIGHT; y++) {
                for (let x = 0; x < GRID_WIDTH; x++) {
                    const tile = grid[y][x];
                    if (tile.type === 'dirt') {
                        ctx.fillStyle = '#8B4513'; // Brown
                    } else if (tile.type === 'stone') {
                        ctx.fillStyle = '#808080'; // Gray
                    } else {
                        ctx.fillStyle = '#000000';
                    }
                    
                    ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                    
                    // Draw grid lines
                    ctx.strokeStyle = '#5D2E06';
                    ctx.strokeRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                }
            }
        }

        // Player Class
        class Player {
            constructor() {
                this.x = Math.floor(GRID_WIDTH / 2);
                this.y = Math.floor(GRID_HEIGHT / 2);
                this.color = '#FFD700'; // Gold
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(
                    (this.x + 0.5) * TILE_SIZE, 
                    (this.y + 0.5) * TILE_SIZE, 
                    TILE_SIZE / 2 - 4, 
                    0, 
                    Math.PI * 2
                );
                ctx.fill();
            }

            move(dx, dy) {
                const newX = this.x + dx;
                const newY = this.y + dy;

                if (newX >= 0 && newX < GRID_WIDTH && newY >= 0 && newY < GRID_HEIGHT) {
                    const targetTile = grid[newY][newX];
                    // If the tile is empty or not drillable, we can move there
                    if (!targetTile.isDrillable || targetTile.type === 'empty') {
                        this.x = newX;
                        this.y = newY;
                    }
                }
            }
        }

        const player = new Player();

        function gameLoop() {
            draw();
            player.draw();
            requestAnimationFrame(gameLoop);
        }

        // Initialize Grid and Generation
        function initGame() {
            generateCave();
        }

        // Input Handling
        window.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp':    player.move(0, -1); break;
                case 'ArrowDown':  player.move(0, 1);  break;
                case 'ArrowLeft':  player.move(-1, 0); break;
                case 'ArrowRight': player.move(1, 0);  break;
            }
        });

        // Clicking to drill
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / TILE_SIZE);
            const y = Math.floor((e.clientY - rect.top) / TILE_SIZE);

            if (x >= 0 && x < GRID_WIDTH && y >= 0 && y < GRID_HEIGHT) {
                const tile = grid[y][x];
                if (tile.type === 'dirt') {
                    tile.type = 'empty';
                    tile.isDrillable = false;
                }
            }
        });

        initGame();
        gameLoop();
    </script>
</body>
</html>
