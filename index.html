<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digger - Gem Hunt</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0; padding: 0; background-color: #1a252f; color: white;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100vh; overflow: hidden;
}
#ui {
    position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7);
    padding: 12px 16px; border-radius: 8px; border: 1px solid #4a6fa5; min-width: 190px; z-index: 10;
}
#ui h1 { margin: 0 0 8px 0; font-size: 20px; color: #f0c040; text-shadow: 0 0 8px #f0c040; }
#ui .highscore { font-size: 11px; color: #7f8c8d; margin-top: 2px; }
#ui .stat { font-size: 13px; margin: 3px 0; }
#ui .combo { font-size: 13px; margin: 3px 0; color: #ff8c00; font-weight: bold; min-height: 16px; }
.bar-container { margin-top: 6px; background: #333; border-radius: 4px; height: 10px; width: 100%; border: 1px solid #555; }
.bar-fill { height: 100%; border-radius: 4px; transition: width 0.1s; }
#fuel-bar { background: linear-gradient(90deg,#e74c3c,#f39c12,#2ecc71); }
#hull-bar { background: linear-gradient(90deg,#7f1d1d,#c0392b); }
#inventory { margin-top: 8px; font-size: 12px; color: #bdc3c7; max-width: 210px; word-wrap: break-word; }
canvas { background-color: #0a0a0a; box-shadow: 0 0 30px rgba(0,0,0,0.8); image-rendering: pixelated; }
#overlay, #shop-overlay, #leaderboard-overlay, #settings-overlay {
    display: none; position: absolute; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.85);
    flex-direction: column; align-items: center; justify-content: center; z-index: 20;
}
#overlay.visible, #shop-overlay.visible, #leaderboard-overlay.visible, #settings-overlay.visible { display: flex; }

#overlay h2 { font-size: 44px; color: #e74c3c; text-shadow: 0 0 20px #e74c3c; margin: 0 0 10px 0; }
#overlay .final-score { font-size: 24px; color: #f0c040; margin-bottom: 10px; }
#overlay .gems-found { font-size: 15px; color: #bdc3c7; margin-bottom: 20px; text-align:center; max-width:500px; }
.big-btn {
    padding: 12px 30px; font-size: 16px; background: #27ae60; color: white; border: none;
    border-radius: 8px; cursor: pointer; transition: background 0.2s, transform 0.1s; margin: 6px;
}
.big-btn:hover { background: #2ecc71; transform: scale(1.05); }
.big-btn:active { transform: scale(0.97); }
.big-btn.red { background: #c0392b; } .big-btn.red:hover { background: #e74c3c; }
#controls-hint {
    position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.6); padding: 8px 12px;
    border-radius: 6px; font-size: 10px; color: #7f8c8d; z-index: 10; max-width: 260px; text-align:right;
}
#shop-overlay h2 { font-size: 30px; color: #f0c040; text-shadow: 0 0 10px #f0c040; margin: 0 0 6px 0; }
.shop-subtitle { font-size: 14px; color: #95a5a6; margin-bottom: 16px; }
.shop-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 560px; width: 100%; padding: 0 20px; }
.shop-item { background: rgba(255,255,255,0.07); border: 1px solid #4a6fa5; border-radius: 8px; padding: 12px; cursor: pointer; transition: background .15s, border-color .15s; }
.shop-item:hover:not(.disabled) { background: rgba(255,255,255,0.14); border-color: #f0c040; }
.shop-item.disabled { opacity: 0.4; cursor: not-allowed; }
.shop-item .item-name { font-size: 14px; font-weight: bold; color: #ecf0f1; }
.shop-item .item-desc { font-size: 11px; color: #95a5a6; margin: 4px 0 8px 0; }
.shop-item .item-cost { font-size: 12px; color: #f0c040; }
.shop-item .item-level { font-size: 11px; color: #7f8c8d; float: right; }
#shop-score-display { font-size: 16px; color: #f0c040; margin-bottom: 14px; }
#leaderboard-overlay h2 { font-size: 28px; color: #f0c040; margin-bottom: 14px; }
#leaderboard-list { width: 90%; max-width: 500px; max-height: 300px; overflow-y: auto; margin-bottom: 16px; }
.lb-row { display: flex; justify-content: space-between; padding: 6px 12px; background: rgba(255,255,255,0.05); border-radius: 6px; margin-bottom: 4px; font-size: 13px; }
.lb-row.top1 { color: #f0c040; font-weight: bold; }
#dpad {
    position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); display: grid;
    grid-template-columns: 50px 50px 50px; grid-template-rows: 50px 50px 50px; gap: 4px; z-index: 15; user-select: none;
}
#dpad button { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); border-radius: 8px; color: white; font-size: 20px; cursor: pointer; display:flex; align-items:center; justify-content:center; }
#sound-toggle {
    position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); border: 1px solid #4a6fa5;
    color: white; font-size: 18px; padding: 8px 12px; border-radius: 8px; cursor: pointer; z-index: 10;
}
#lb-toggle {
    position: absolute; top: 10px; right: 60px; background: rgba(0,0,0,0.7); border: 1px solid #4a6fa5;
    color: white; font-size: 16px; padding: 8px 12px; border-radius: 8px; cursor: pointer; z-index: 10;
}
#settings-toggle {
    position: absolute; top: 10px; right: 110px; background: rgba(0,0,0,0.7); border: 1px solid #4a6fa5;
    color: white; font-size: 16px; padding: 8px 12px; border-radius: 8px; cursor: pointer; z-index: 10;
}
#settings-overlay h2 { font-size: 28px; color: #f0c040; margin-bottom: 14px; }
.settings-grid { width: 90%; max-width: 420px; margin-bottom: 16px; }
.settings-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px;
    background: rgba(255,255,255,0.05); border-radius: 6px; margin-bottom: 8px; font-size: 14px; }
.settings-row input[type="range"] { width: 130px; }
.settings-row label { display:flex; align-items:center; gap:8px; }
@keyframes pulseWarn { 0%,100% { filter:brightness(1); } 50% { filter:brightness(1.6); } }
.bar-fill.pulse { animation: pulseWarn 0.6s infinite; }
#screen-flash {
    position: absolute; top:0; left:0; right:0; bottom:0; background: rgba(255,0,0,0.35);
    pointer-events: none; z-index: 25; opacity: 0; transition: opacity 0.15s;
}
#screen-flash.active { opacity: 1; }
.shop-item.highlighted, .settings-row.highlighted { outline: 2px solid #f0c040; }
</style>

</head>
<body>
<div id="ui">
    <h1>⛏ Digger</h1>
    <div class="stat">Score: <span id="score">0</span></div>
    <div class="highscore">Best: <span id="ui-highscore">0</span></div>
    <div class="stat">Depth: <span id="depth">0</span>m <span id="biome-name" style="color:#7f8c8d;font-size:11px;"></span></div>
    <div class="combo" id="combo-display"></div>
    <div class="stat">Fuel:</div>
    <div class="bar-container"><div id="fuel-bar" class="bar-fill" style="width:100%"></div></div>
    <div class="stat">Hull:</div>
    <div class="bar-container"><div id="hull-bar" class="bar-fill" style="width:100%"></div></div>
    <div id="inventory">Gems: None</div>
</div>

<button id="sound-toggle">🔊</button>
<button id="lb-toggle">🏆</button>
<button id="settings-toggle">⚙️</button>

<canvas id="gameCanvas"></canvas>
<div id="screen-flash"></div>


<div id="overlay">
    <h2 id="overlay-title">⛽ Out of Fuel!</h2>
    <div class="final-score">Final Score: <span id="final-score">0</span></div>
    <div id="high-score-display" style="font-size:15px;color:#95a5a6;margin-bottom:8px;"></div>
    <div class="gems-found" id="gems-found"></div>
    <div>
        <button class="big-btn" id="restart-btn">⛏ Dig Again</button>
        <button class="big-btn red" id="overlay-lb-btn">🏆 Leaderboard</button>
    </div>
</div>

<div id="controls-hint">Arrow Keys / D-Pad &nbsp;|&nbsp; ⛽ Fuel &nbsp;|&nbsp; 🏠 Base &nbsp;|&nbsp; 🌋 Lava &nbsp;|&nbsp; 💎 Combo gems fast!</div>

<div id="dpad">
    <div></div><button id="dpad-up">▲</button><div></div>
    <button id="dpad-left">◀</button><div style="background:rgba(255,255,255,0.05);border-radius:8px;"></div><button id="dpad-right">▶</button>
    <div></div><button id="dpad-down">▼</button><div></div>
</div>

<div id="shop-overlay">
    <h2>🏠 Surface Base</h2>
    <div class="shop-subtitle">Spend your score to upgrade your drill!</div>
    <div id="shop-score-display">Score: <span id="shop-score">0</span></div>
    <div class="shop-grid" id="shop-grid"></div>
    <button class="big-btn red" id="shop-close-btn">⛏ Back to Digging</button>
</div>

<div id="leaderboard-overlay">
    <h2>🏆 Leaderboard — Top Runs</h2>
    <div id="leaderboard-list"></div>
    <button class="big-btn red" id="lb-close-btn">Close</button>
</div>

<div id="settings-overlay">
    <h2>⚙️ Settings</h2>
    <div class="settings-grid" id="settings-grid">
        <div class="settings-row">
            <label><input type="checkbox" id="setting-dpad"> Show D-Pad</label>
        </div>
        <div class="settings-row">
            <label><input type="checkbox" id="setting-sfx"> Sound Effects</label>
            <input type="range" id="setting-sfx-vol" min="0" max="1" step="0.05">
        </div>
        <div class="settings-row">
            <label><input type="checkbox" id="setting-music"> Music</label>
            <input type="range" id="setting-music-vol" min="0" max="1" step="0.05">
        </div>
    </div>
    <button class="big-btn red" id="settings-close-btn">Close</button>
</div>


<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreElement = document.getElementById('score');
const depthElement = document.getElementById('depth');
const biomeNameEl = document.getElementById('biome-name');
const comboDisplay = document.getElementById('combo-display');
const inventoryElement = document.getElementById('inventory');
const fuelBar = document.getElementById('fuel-bar');
const hullBar = document.getElementById('hull-bar');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlay-title');
const finalScoreEl = document.getElementById('final-score');
const gemsFoundEl = document.getElementById('gems-found');
const restartBtn = document.getElementById('restart-btn');
const shopOverlayEl = document.getElementById('shop-overlay');
const lbOverlayEl = document.getElementById('leaderboard-overlay');
const settingsOverlayEl = document.getElementById('settings-overlay');
const dpadEl = document.getElementById('dpad');
const screenFlashEl = document.getElementById('screen-flash');


// ── Configuration ──────────────────────────────────────────────────────────
const TILE_SIZE = 40;
const GRID_WIDTH = 80;
const GRID_HEIGHT = 120;
const VIEW_TILES_X = 20, VIEW_TILES_Y = 15;
canvas.width = VIEW_TILES_X * TILE_SIZE;
canvas.height = VIEW_TILES_Y * TILE_SIZE;

const TILES = {
    EMPTY:0, DIRT:1, STONE:2, GOLD:3, DIAMOND:4, BEDROCK:5, FUEL:6, BASE:7,
    LAVA:8, UNSTABLE:9, RUBY:10, EMERALD:11, SAPPHIRE:12, UNOBTAINIUM:13
};

const TILE_COLORS = {
    [TILES.EMPTY]:'#111', [TILES.DIRT]:'#8b4513', [TILES.STONE]:'#6b7280',
    [TILES.GOLD]:'#ffd700', [TILES.DIAMOND]:'#00e5ff', [TILES.BEDROCK]:'#2d2d2d',
    [TILES.FUEL]:'#e67e22', [TILES.BASE]:'#27ae60', [TILES.LAVA]:'#c0392b',
    [TILES.UNSTABLE]:'#a0522d', [TILES.RUBY]:'#e0115f', [TILES.EMERALD]:'#50c878',
    [TILES.SAPPHIRE]:'#0f52ba', [TILES.UNOBTAINIUM]:'#ffffff'
};
const TILE_BORDER_COLORS = {
    [TILES.EMPTY]:'#111', [TILES.DIRT]:'#6b3410', [TILES.STONE]:'#4b5563',
    [TILES.GOLD]:'#b8960a', [TILES.DIAMOND]:'#0099aa', [TILES.BEDROCK]:'#1a1a1a',
    [TILES.FUEL]:'#a04010', [TILES.BASE]:'#1a7a40', [TILES.LAVA]:'#7b0000',
    [TILES.UNSTABLE]:'#6b3010', [TILES.RUBY]:'#8a0a3c', [TILES.EMERALD]:'#2e8b4f',
    [TILES.SAPPHIRE]:'#0a2f6e', [TILES.UNOBTAINIUM]:'#888'
};

const GEM_REWARDS = {
    [TILES.GOLD]:50, [TILES.DIAMOND]:200, [TILES.RUBY]:100, [TILES.EMERALD]:150,
    [TILES.SAPPHIRE]:300, [TILES.UNOBTAINIUM]:5000
};
const GEM_NAMES = {
    [TILES.GOLD]:'Gold', [TILES.DIAMOND]:'Diamond', [TILES.RUBY]:'Ruby',
    [TILES.EMERALD]:'Emerald', [TILES.SAPPHIRE]:'Sapphire', [TILES.UNOBTAINIUM]:'Unobtainium'
};

// ── Biomes ──────────────────────────────────────────────────────────────────
const BIOMES = [
    { name:'Surface',   from:0.00, to:0.08, bg:'#1a252f', tint:null },
    { name:'Cavern',    from:0.08, to:0.35, bg:'#241a14', tint:null },
    { name:'Ice Layer', from:0.35, to:0.55, bg:'#16232e', tint:'rgba(100,180,255,0.06)' },
    { name:'Magma Layer',from:0.55, to:0.78, bg:'#2a1210', tint:'rgba(255,80,20,0.08)' },
    { name:'Deep Core', from:0.78, to:1.01, bg:'#050505', tint:'rgba(150,0,255,0.05)' }
];
function getBiome(depthFrac) {
    for (const b of BIOMES) if (depthFrac >= b.from && depthFrac < b.to) return b;
    return BIOMES[BIOMES.length-1];
}

const FUEL_PER_MOVE = 2, FUEL_PER_STONE = 3, MAX_FUEL = 200;
const FUEL_CANISTER_AMOUNT = 40;
const MAX_HULL = 100;
const LAVA_FUEL_DAMAGE = 30, LAVA_HULL_DAMAGE = 20;
const CAVEIN_HULL_DAMAGE = 15;

const UPGRADES = [
    { id:'drillPower', name:'⚙️ Drill Power', desc:'Increases drill strength', costs:[0,100,250,500,1000], maxLevel:4 },
    { id:'moveSpeed', name:'🚀 Move Speed', desc:'Drill moves faster', costs:[0,80,200,400], maxLevel:3 },
    { id:'fuelEfficiency', name:'⛽ Fuel Efficiency', desc:'Reduces fuel cost per move', costs:[0,120,300,600], maxLevel:3 },
    { id:'fuelCapacity', name:'🛢️ Fuel Tank', desc:'Increases max fuel capacity', costs:[0,150,350,700], maxLevel:3 },
    { id:'hullPlating', name:'🛡️ Hull Plating', desc:'Increases max hull & reduces damage', costs:[0,150,350,700], maxLevel:3 }
];

// ── Game State ───────────────────────────────────────────────────────────────
let grid = [], player = {}, score = 0, fuel = MAX_FUEL, maxFuel = MAX_FUEL;
let hull = MAX_HULL, maxHull = MAX_HULL;
let inventory = {}, gameOver = false, shopOpen = false, settingsOpen = false, keys = {}, moveTimer = 0;

const MOVE_DELAY = 8;
let upgradeLevels = { drillPower:0, moveSpeed:0, fuelEfficiency:0, fuelCapacity:0, hullPlating:0 };
let comboCount = 0, comboMultiplier = 1, comboTimer = 0;
const COMBO_TIMER_MAX = 180; // 3s @ 60fps
let soundEnabled = true;
let unobtainiumFound = false;

// ── Settings ─────────────────────────────────────────────────────────────────
const SETTINGS_KEY = 'gemdigger_settings';
let settings = { dpad: true, sfx: true, sfxVol: 0.8, music: true, musicVol: 0.25 };
function loadSettings() {
    try {
        const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null');
        if (saved) settings = Object.assign(settings, saved);
    } catch(e) {}
    soundEnabled = settings.sfx;
    applySettingsToUI();
    applyDpadVisibility();
}
function saveSettings() { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }
function applySettingsToUI() {
    document.getElementById('setting-dpad').checked = settings.dpad;
    document.getElementById('setting-sfx').checked = settings.sfx;
    document.getElementById('setting-sfx-vol').value = settings.sfxVol;
    document.getElementById('setting-music').checked = settings.music;
    document.getElementById('setting-music-vol').value = settings.musicVol;
    document.getElementById('sound-toggle').textContent = settings.sfx ? '🔊' : '🔇';
}
function applyDpadVisibility() {
    dpadEl.style.display = settings.dpad ? 'grid' : 'none';
}


function getUpgradeValue(id) {
    const lvl = upgradeLevels[id];
    switch(id) {
        case 'drillPower': return 5 + lvl*2;
        case 'moveSpeed': return 6 + lvl*2;
        case 'fuelEfficiency': return Math.max(1, FUEL_PER_MOVE - lvl);
        case 'fuelCapacity': return MAX_FUEL + lvl*50;
        case 'hullPlating': return MAX_HULL + lvl*40;
        default: return 0;
    }
}
function getHullDamageReduction() { return upgradeLevels.hullPlating * 0.15; } // up to 45% reduction

function init() {
    score = 0;
    upgradeLevels = { drillPower:0, moveSpeed:0, fuelEfficiency:0, fuelCapacity:0, hullPlating:0 };
    maxFuel = getUpgradeValue('fuelCapacity'); fuel = maxFuel;
    maxHull = getUpgradeValue('hullPlating'); hull = maxHull;
    inventory = {}; gameOver = false; shopOpen = false; keys = {}; moveTimer = 0;
    comboCount = 0; comboMultiplier = 1; comboTimer = 0;
    unobtainiumFound = false;

    const startX = Math.floor(GRID_WIDTH/2), startY = 2;
    player = {
        x:startX*TILE_SIZE, y:startY*TILE_SIZE, targetX:startX*TILE_SIZE, targetY:startY*TILE_SIZE,
        gridX:startX, gridY:startY, drillPower:getUpgradeValue('drillPower'), moving:false, facing:'down'
    };
    generateWorld();
    updateUI();
    overlay.classList.remove('visible');
    shopOverlayEl.classList.remove('visible');
}

function generateWorld() {
    for (let y=0; y<GRID_HEIGHT; y++) {
        grid[y] = [];
        for (let x=0; x<GRID_WIDTH; x++) {
            if (x===0 || x===GRID_WIDTH-1 || y===GRID_HEIGHT-1) { grid[y][x] = TILES.BEDROCK; continue; }
            if (y <= 1) { grid[y][x] = TILES.EMPTY; continue; }

            const depth = (y-2)/(GRID_HEIGHT-3);
            const biome = getBiome(depth);
            const rand = Math.random();

            const stoneP = 0.05 + depth*0.35;
            const goldP = stoneP + 0.02 + depth*0.05;
            const rubyP = goldP + (depth > 0.30 ? 0.02 : 0);
            const emeraldP = rubyP + (depth > 0.50 ? 0.018 : 0);
            const diamondP = emeraldP + Math.max(0, (depth-0.4)*0.03);
            const sapphireP = diamondP + (depth > 0.75 ? 0.012 : 0);
            const fuelP = sapphireP + 0.015*(1-depth*0.5);
            const lavaP = fuelP + (biome.name==='Magma Layer' ? Math.max(0,(depth-0.5)*0.10) : Math.max(0,(depth-0.5)*0.03));
            const unstableP = lavaP + Math.max(0,(depth-0.2)*0.04);

            if (rand < stoneP) grid[y][x] = TILES.STONE;
            else if (rand < goldP) grid[y][x] = TILES.GOLD;
            else if (rand < rubyP) grid[y][x] = TILES.RUBY;
            else if (rand < emeraldP) grid[y][x] = TILES.EMERALD;
            else if (rand < diamondP) grid[y][x] = TILES.DIAMOND;
            else if (rand < sapphireP) grid[y][x] = TILES.SAPPHIRE;
            else if (rand < fuelP) grid[y][x] = TILES.FUEL;
            else if (rand < lavaP) grid[y][x] = TILES.LAVA;
            else if (rand < unstableP) grid[y][x] = TILES.UNSTABLE;
            else grid[y][x] = TILES.DIRT;
        }
    }

    // Clear player start + place base
    const startX = Math.floor(GRID_WIDTH/2);
    for (let dy=0; dy<=2; dy++) for (let dx=-1; dx<=1; dx++) {
        const gx=startX+dx, gy=dy;
        if (grid[gy] && gx>=0 && gx<GRID_WIDTH) grid[gy][gx] = TILES.EMPTY;
    }
    grid[0][startX] = TILES.BASE;

    // Place exactly one Unobtainium in the Deep Core zone
    const deepCoreStartY = Math.floor(2 + 0.80*(GRID_HEIGHT-3));
    let placed = false, attempts = 0;
    while (!placed && attempts < 500) {
        const rx = 1 + Math.floor(Math.random()*(GRID_WIDTH-2));
        const ry = deepCoreStartY + Math.floor(Math.random()*(GRID_HEIGHT-3-deepCoreStartY));
        if (grid[ry] && grid[ry][rx] !== TILES.BEDROCK && grid[ry][rx] !== TILES.BASE) {
            grid[ry][rx] = TILES.UNOBTAINIUM;
            placed = true;
        }
        attempts++;
    }
}

// ── Sound (Web Audio API, procedural) ───────────────────────────────────────
let audioCtx = null;
function getAudioCtx() { if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function beep(freq, duration, type, gainVal) {
    if (!soundEnabled) return;
    try {
        const ctxA = getAudioCtx();
        const osc = ctxA.createOscillator(); const gain = ctxA.createGain();
        osc.type = type || 'sine'; osc.frequency.value = freq;
        gain.gain.setValueAtTime((gainVal || 0.15) * settings.sfxVol, ctxA.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctxA.currentTime + duration);
        osc.connect(gain); gain.connect(ctxA.destination);
        osc.start(); osc.stop(ctxA.currentTime + duration);
    } catch(e) {}
}
function sfxDig() { beep(120,0.08,'square',0.06); }
function sfxGem(rarity) { beep(500 + rarity*150, 0.18, 'sine', 0.12); beep(700 + rarity*150, 0.12, 'sine', 0.08); }
function sfxFuel() { beep(300,0.15,'triangle',0.1); beep(450,0.12,'triangle',0.08); }
function sfxLava() { beep(80,0.3,'sawtooth',0.15); }
function sfxCavein() { beep(60,0.4,'sawtooth',0.12); }
function sfxLegendary() { [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,0.3,'sine',0.15), i*120)); }
function sfxShop() { beep(600,0.08,'square',0.08); }
function sfxLowWarning() { beep(220,0.12,'sine',0.08); }
function sfxHullWarning() { beep(150,0.15,'square',0.1); }

document.getElementById('sound-toggle').addEventListener('click', function() {
    settings.sfx = !settings.sfx;
    soundEnabled = settings.sfx;
    this.textContent = soundEnabled ? '🔊' : '🔇';
    saveSettings();
});

// ── Background Music (procedural loop) ──────────────────────────────────────
let musicStarted = false, musicNodes = [];
function startMusic() {
    if (musicStarted || !settings.music) return;
    musicStarted = true;
    try {
        const ctxA = getAudioCtx();
        const notes = [130.81, 164.81, 196.00, 164.81]; // simple bass loop (C3,E3,G3,E3)
        let step = 0;
        function playStep() {
            if (!settings.music) { musicStarted = false; return; }
            const ctxA2 = getAudioCtx();
            const osc = ctxA2.createOscillator(); const gain = ctxA2.createGain();
            osc.type = 'sine'; osc.frequency.value = notes[step % notes.length];
            gain.gain.setValueAtTime(0.0001, ctxA2.currentTime);
            gain.gain.linearRampToValueAtTime(0.12*settings.musicVol, ctxA2.currentTime+0.1);
            gain.gain.linearRampToValueAtTime(0.0001, ctxA2.currentTime+0.9);
            osc.connect(gain); gain.connect(ctxA2.destination);
            osc.start(); osc.stop(ctxA2.currentTime+1.0);
            step++;
            setTimeout(playStep, 1000);
        }
        playStep();
    } catch(e) {}
}
function tryStartMusicOnGesture() {
    if (settings.music && !musicStarted) startMusic();
    window.removeEventListener('keydown', tryStartMusicOnGesture);
    window.removeEventListener('mousedown', tryStartMusicOnGesture);
    window.removeEventListener('touchstart', tryStartMusicOnGesture);
}
window.addEventListener('keydown', tryStartMusicOnGesture);
window.addEventListener('mousedown', tryStartMusicOnGesture);
window.addEventListener('touchstart', tryStartMusicOnGesture);

// ── Particles ────────────────────────────────────────────────────────────────
let particles = [];
function spawnParticles(gx, gy, color, count) {
    const px = gx*TILE_SIZE + TILE_SIZE/2, py = gy*TILE_SIZE + TILE_SIZE/2;

// ── Combo ────────────────────────────────────────────────────────────────────
function registerGemHit() {
    comboCount++;
    comboMultiplier = Math.min(5, 1 + (comboCount-1)*0.5);
    comboTimer = COMBO_TIMER_MAX;
}
function resetCombo() { comboCount = 0; comboMultiplier = 1; comboTimer = 0; }

// ── Movement / Mining ─────────────────────────────────────────────────────────
function tryMove(dx, dy) {
    if (gameOver || player.moving) return;
    const newGridX = player.gridX+dx, newGridY = player.gridY+dy;
    if (newGridX<0||newGridX>=GRID_WIDTH||newGridY<0||newGridY>=GRID_HEIGHT) return;
    const targetTile = grid[newGridY][newGridX];
    if (targetTile === TILES.BEDROCK) return;

    let fuelCost = getUpgradeValue('fuelEfficiency');
    if (targetTile === TILES.STONE) fuelCost += FUEL_PER_STONE;
    if (fuel <= 0) { triggerGameOver('fuel'); return; }

    if (dx>0) player.facing='right'; else if (dx<0) player.facing='left';
    else if (dy>0) player.facing='down'; else if (dy<0) player.facing='up';

    const isGem = [TILES.GOLD,TILES.DIAMOND,TILES.RUBY,TILES.EMERALD,TILES.SAPPHIRE,TILES.UNOBTAINIUM].includes(targetTile);

    if (targetTile !== TILES.EMPTY) {
        if (targetTile === TILES.LAVA) {
            const dmgReduction = getHullDamageReduction();
            fuel = Math.max(0, fuel - LAVA_FUEL_DAMAGE);
            hull = Math.max(0, hull - LAVA_HULL_DAMAGE*(1-dmgReduction));
            showFloatingText(`-${LAVA_FUEL_DAMAGE} Fuel / -Hull!`, newGridX, newGridY, '#e74c3c');
            spawnParticles(newGridX, newGridY, '#ff6600', 10);
            sfxLava();
            resetCombo();
            if (fuel<=0) triggerGameOver('fuel');
            else if (hull<=0) triggerGameOver('hull');
            return;
        }

        const toughness = targetTile === TILES.STONE ? 3 : 1;
        if (player.drillPower < toughness) return;

        if (isGem) {
            registerGemHit();
            const gemName = GEM_NAMES[targetTile];
            const baseReward = GEM_REWARDS[targetTile];
            const reward = Math.round(baseReward * comboMultiplier);
            score += reward;
            inventory[gemName] = (inventory[gemName]||0)+1;
            const rarity = targetTile===TILES.UNOBTAINIUM?6:targetTile===TILES.SAPPHIRE?4:targetTile===TILES.DIAMOND?3:targetTile===TILES.EMERALD?2:targetTile===TILES.RUBY?1:0;
            sfxGem(rarity);
            spawnParticles(newGridX, newGridY, TILE_COLORS[targetTile], targetTile===TILES.UNOBTAINIUM?30:12);
            const comboTxt = comboMultiplier>1 ? ` (${comboMultiplier.toFixed(1)}x)` : '';
            showFloatingText(`+${reward}${comboTxt}`, newGridX, newGridY, targetTile===TILES.UNOBTAINIUM?'#ffdd00':'#fff');

            if (targetTile === TILES.UNOBTAINIUM) {
                unobtainiumFound = true;
                sfxLegendary();
                showFloatingText('LEGENDARY!!!', newGridX, newGridY-1, '#ffdd00');
            }
        } else {
            spawnParticles(newGridX, newGridY, targetTile===TILES.STONE?'#6b7280':'#8b4513', 6);
            sfxDig();
        }

        if (targetTile === TILES.FUEL) {
            fuel = Math.min(maxFuel, fuel + FUEL_CANISTER_AMOUNT);
            showFloatingText('+Fuel', newGridX, newGridY, '#e67e22');
            sfxFuel();
        }

        if (targetTile === TILES.BASE) {
            fuel = maxFuel; hull = maxHull;
            showFloatingText('Refuelled!', newGridX, newGridY, '#2ecc71');
            fuel = Math.max(0, fuel - fuelCost);
            player.moving = true;
            player.targetX = newGridX*TILE_SIZE; player.targetY = newGridY*TILE_SIZE;
            player.gridX = newGridX; player.gridY = newGridY;
            setTimeout(openShop, 300);
            return;
        }

        if (targetTile === TILES.UNSTABLE) {
            grid[newGridY][newGridX] = TILES.EMPTY;
            showFloatingText('Cave-in!', newGridX, newGridY, '#e67e22');
            spawnParticles(newGridX, newGridY, '#a0522d', 14);
            sfxCavein();
            resetCombo();
            triggerCaveIn(newGridX, newGridY);
            fuel = Math.max(0, fuel - fuelCost);
            player.moving = true;
            player.targetX = newGridX*TILE_SIZE; player.targetY = newGridY*TILE_SIZE;
            player.gridX = newGridX; player.gridY = newGridY;
            if (fuel<=0) setTimeout(()=>triggerGameOver('fuel'),400);
            return;
        }

        grid[newGridY][newGridX] = TILES.EMPTY;
    } else {
        // Moving through empty space breaks combo streak
        if (comboCount > 0) resetCombo();
    }

    fuel = Math.max(0, fuel - fuelCost);
    player.moving = true;
    player.targetX = newGridX*TILE_SIZE; player.targetY = newGridY*TILE_SIZE;
    player.gridX = newGridX; player.gridY = newGridY;
    if (fuel<=0) setTimeout(()=>triggerGameOver('fuel'),400);
}

function triggerCaveIn(cx, cy) {
    const radius = 2, collapseTargets = [];
    for (let dy=-radius; dy<=radius; dy++) for (let dx=-radius; dx<=radius; dx++) {
        if (dx===0&&dy===0) continue;
        const nx=cx+dx, ny=cy+dy;
        if (nx<1||nx>=GRID_WIDTH-1||ny<2||ny>=GRID_HEIGHT-1) continue;
        if (grid[ny][nx] === TILES.EMPTY) collapseTargets.push({x:nx,y:ny});
    }
    const toCollapse = collapseTargets.sort(()=>Math.random()-0.5).slice(0, Math.floor(collapseTargets.length*0.4));
    setTimeout(()=>{
        for (const t of toCollapse) {
            if (t.x===player.gridX && t.y===player.gridY) {
                const dmgReduction = getHullDamageReduction();
                hull = Math.max(0, hull - CAVEIN_HULL_DAMAGE*(1-dmgReduction));
                showFloatingText('-Hull!', t.x, t.y, '#e74c3c');
                if (hull<=0) triggerGameOver('hull');
                continue;
            }
            if (grid[t.y][t.x] === TILES.EMPTY) grid[t.y][t.x] = TILES.DIRT;
        }
    }, 500);
}

function openShop() {

    shopOpen = false; shopOverlayEl.classList.remove('visible');

    maxFuel = getUpgradeValue('fuelCapacity'); fuel = Math.min(fuel, maxFuel);

function renderShop() {
    document.getElementById('shop-score').textContent = score;

    for (const upg of UPGRADES) {
        const currentLevel = upgradeLevels[upg.id];

        const div = document.createElement('div');
        div.className = 'shop-item' + ((!canAfford && !isMaxed) ? ' disabled' : '');

            <div class="item-desc">${upg.desc}</div>
            <div class="item-cost">${isMaxed?'✅ Maxed out':`Cost: ${cost} pts`}</div>`;
        if (canAfford) div.addEventListener('click', ()=>{ score-=cost; upgradeLevels[upg.id]++; sfxShop(); renderShop(); });
        gridEl.appendChild(div);
    }
}

// ── Update Loop ──────────────────────────────────────────────────────────────
function update() {
    if (gameOver || shopOpen || settingsOpen) return;


    if (moveTimer > 0) moveTimer--;
    else {
        if (keys['ArrowUp']) { tryMove(0,-1); moveTimer=MOVE_DELAY; }
        if (keys['ArrowDown']) { tryMove(0,1); moveTimer=MOVE_DELAY; }
        if (keys['ArrowLeft']) { tryMove(-1,0); moveTimer=MOVE_DELAY; }
        if (keys['ArrowRight']) { tryMove(1,0); moveTimer=MOVE_DELAY; }
    }

    const SPEED = getUpgradeValue('moveSpeed');
    if (player.x !== player.targetX) {
        const dir = player.targetX>player.x?1:-1; player.x += dir*SPEED;
        if (Math.abs(player.targetX-player.x)<=SPEED) player.x = player.targetX;
    }
    if (player.y !== player.targetY) {
        const dir = player.targetY>player.y?1:-1; player.y += dir*SPEED;
        if (Math.abs(player.targetY-player.y)<=SPEED) player.y = player.targetY;
    }
    if (player.x===player.targetX && player.y===player.targetY) player.moving=false;

    if (comboTimer > 0) { comboTimer--; if (comboTimer===0) resetCombo(); }

    // Low-fuel warning sfx
    if (fuel > 0 && fuel/maxFuel <= 0.2) {
        lowFuelTimer--;
        if (lowFuelTimer <= 0) { sfxLowWarning(); lowFuelTimer = 90; }
    } else { lowFuelTimer = 0; }

    // Hull damage threshold sfx + screen flash (crossing 50%/25%)
    const hullPct = hull/maxHull*100;
    if (hullPct <= 50 && lastHullWarnThreshold > 50) { sfxHullWarning(); screenFlash(); }
    if (hullPct <= 25 && lastHullWarnThreshold > 25) { sfxHullWarning(); screenFlash(); }
    lastHullWarnThreshold = hullPct;

    // Update particles
    particles = particles.filter(p=>p.life>0);
    for (const p of particles) { p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.life--; }

    updateUI();
}


// ── Draw ────────────────────────────────────────────────────────────────────
function draw() {
    const depthFrac = Math.max(0,(player.gridY-2)/(GRID_HEIGHT-3));
    const biome = getBiome(depthFrac);
    ctx.fillStyle = biome.bg;
    ctx.fillRect(0,0,canvas.width,canvas.height);

    const camX = player.x+TILE_SIZE/2-canvas.width/2;
    const camY = player.y+TILE_SIZE/2-canvas.height/2;
    const maxCamX = GRID_WIDTH*TILE_SIZE-canvas.width;
    const maxCamY = GRID_HEIGHT*TILE_SIZE-canvas.height;
    const clampedCamX = Math.max(0, Math.min(camX, maxCamX));
    const clampedCamY = Math.max(0, Math.min(camY, maxCamY));

    ctx.save();
    ctx.translate(-clampedCamX, -clampedCamY);

    const startTileX = Math.max(0, Math.floor(clampedCamX/TILE_SIZE));
    const endTileX = Math.min(GRID_WIDTH-1, Math.ceil((clampedCamX+canvas.width)/TILE_SIZE));
    const startTileY = Math.max(0, Math.floor(clampedCamY/TILE_SIZE));
    const endTileY = Math.min(GRID_HEIGHT-1, Math.ceil((clampedCamY+canvas.height)/TILE_SIZE));

    for (let y=startTileY; y<=endTileY; y++) {
        for (let x=startTileX; x<=endTileX; x++) {
            const type = grid[y][x];
            const px = x*TILE_SIZE, py = y*TILE_SIZE;
            ctx.fillStyle = TILE_COLORS[type] || '#111';
            ctx.fillRect(px,py,TILE_SIZE,TILE_SIZE);
            if (type !== TILES.EMPTY) {
                ctx.strokeStyle = TILE_BORDER_COLORS[type] || '#000';
                ctx.lineWidth = 1;
                ctx.strokeRect(px+0.5,py+0.5,TILE_SIZE-1,TILE_SIZE-1);
            }

            if ([TILES.GOLD,TILES.DIAMOND,TILES.RUBY,TILES.EMERALD,TILES.SAPPHIRE].includes(type)) {
                ctx.save();
                ctx.globalAlpha = 0.3+0.15*Math.sin(Date.now()/300);
                ctx.fillStyle = TILE_COLORS[type];
                ctx.fillRect(px+4,py+4,TILE_SIZE-8,TILE_SIZE-8);
                ctx.restore();
            }

            if (type === TILES.UNOBTAINIUM) {
                ctx.save();
                const hue = (Date.now()/10) % 360;
                ctx.fillStyle = `hsl(${hue},100%,70%)`;
                ctx.globalAlpha = 0.6+0.3*Math.sin(Date.now()/150);
                ctx.beginPath();
                ctx.arc(px+TILE_SIZE/2, py+TILE_SIZE/2, TILE_SIZE/2-2, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.font = `bold ${TILE_SIZE*0.5}px sans-serif`;
                ctx.textAlign='center'; ctx.textBaseline='middle';
                ctx.fillText('✨', px+TILE_SIZE/2, py+TILE_SIZE/2);
                ctx.restore();
            }

            if (type === TILES.LAVA) {
                ctx.save();
                ctx.globalAlpha = 0.4+0.3*Math.sin(Date.now()/200+x*0.5);
                ctx.fillStyle = '#ff6600';
                ctx.fillRect(px+3,py+3,TILE_SIZE-6,TILE_SIZE-6);
                ctx.restore();
                ctx.save();
                ctx.fillStyle='#fff'; ctx.font=`bold ${TILE_SIZE*0.5}px sans-serif`;
                ctx.textAlign='center'; ctx.textBaseline='middle';
                ctx.fillText('🌋', px+TILE_SIZE/2, py+TILE_SIZE/2);
                ctx.restore();
            }

            if (type === TILES.UNSTABLE) {
                ctx.save();
                ctx.strokeStyle='#ff8c00'; ctx.lineWidth=1.5; ctx.globalAlpha=0.6;
                ctx.beginPath(); ctx.moveTo(px+8,py+5); ctx.lineTo(px+20,py+20); ctx.lineTo(px+15,py+35); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(px+25,py+8); ctx.lineTo(px+18,py+22); ctx.stroke();
                ctx.restore();
            }

            if (type === TILES.FUEL) {
                ctx.save();
                ctx.globalAlpha = 0.85+0.15*Math.sin(Date.now()/400);
                ctx.fillStyle='#fff'; ctx.font=`bold ${TILE_SIZE*0.55}px sans-serif`;
                ctx.textAlign='center'; ctx.textBaseline='middle';
                ctx.fillText('⛽', px+TILE_SIZE/2, py+TILE_SIZE/2);
                ctx.restore();
            }

            if (type === TILES.BASE) {
                ctx.save();
                ctx.fillStyle='#fff'; ctx.font=`bold ${TILE_SIZE*0.55}px sans-serif`;
                ctx.textAlign='center'; ctx.textBaseline='middle';
                ctx.fillText('🏠', px+TILE_SIZE/2, py+TILE_SIZE/2);
                ctx.restore();
            }
        }
    }

    // Biome tint overlay
    if (biome.tint) {
        ctx.fillStyle = biome.tint;
        ctx.fillRect(clampedCamX, clampedCamY, canvas.width, canvas.height);
    }

    // Particles
    for (const p of particles) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life/50);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
    }

    // Floating texts
    floatingTexts = floatingTexts.filter(ft=>ft.life>0);
    for (const ft of floatingTexts) {
        ctx.save();
        ctx.globalAlpha = ft.alpha;
        ctx.fillStyle = ft.color;
        ctx.font = 'bold 13px Segoe UI, sans-serif';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
        ft.y += ft.vy; ft.life--; ft.alpha = ft.life/60;
    }

    // Player (Drill)
    const px = player.x+TILE_SIZE/2, py = player.y+TILE_SIZE/2, r = TILE_SIZE/2.5;
    ctx.save();
    ctx.translate(px,py);
    const rotations = { right:0, down:Math.PI/2, left:Math.PI, up:-Math.PI/2 };
    ctx.rotate(rotations[player.facing]||0);
    ctx.fillStyle='#c0392b'; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#e8e8e8'; ctx.beginPath();
    ctx.moveTo(r,0); ctx.lineTo(r*0.3,-r*0.5); ctx.lineTo(r*0.3,r*0.5); ctx.closePath(); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.25)'; ctx.beginPath(); ctx.arc(-r*0.2,-r*0.3,r*0.4,0,Math.PI*2); ctx.fill();
    ctx.restore();

    ctx.restore();
}

function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }

// ── Input ────────────────────────────────────────────────────────────────────
let shopHighlightIndex = 0;
window.addEventListener('keydown', (e)=>{
    // Game Over overlay keyboard controls
    if (overlay.classList.contains('visible')) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); init(); return; }
        if (e.key === 'Escape' || e.key.toLowerCase() === 'l') { e.preventDefault(); renderLeaderboard(); lbOverlayEl.classList.add('visible'); return; }
        return;
    }
    // Leaderboard overlay keyboard controls
    if (lbOverlayEl.classList.contains('visible')) {
        if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); lbOverlayEl.classList.remove('visible'); }
        return;
    }
    // Settings overlay keyboard controls
    if (settingsOverlayEl.classList.contains('visible')) {
        if (e.key === 'Escape' || e.key === 'Enter') { e.preventDefault(); closeSettings(); }
        return;
    }
    // Shop overlay keyboard controls
    if (shopOverlayEl.classList.contains('visible')) {
        const items = document.querySelectorAll('#shop-grid .shop-item');
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
            e.preventDefault();
            shopHighlightIndex = (shopHighlightIndex+1) % items.length;
            items.forEach((it,i)=>it.classList.toggle('highlighted', i===shopHighlightIndex));
        } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
            e.preventDefault();
            shopHighlightIndex = (shopHighlightIndex-1+items.length) % items.length;
            items.forEach((it,i)=>it.classList.toggle('highlighted', i===shopHighlightIndex));
        } else if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            const item = items[shopHighlightIndex];
            if (item) item.click();
        } else if (e.key === 'Escape') {
            e.preventDefault(); closeShop();
        }
        return;
    }

    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
        e.preventDefault();
        if (!keys[e.key]) { keys[e.key]=true; moveTimer=0; } else keys[e.key]=true;
    }
});

window.addEventListener('keyup', (e)=>{
    keys[e.key]=false;
    const anyHeld = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].some(k=>keys[k]);
    if (!anyHeld) moveTimer=0;
});
restartBtn.addEventListener('click', ()=>{ init(); });

const dpadBtnMap = { 'dpad-up':[0,-1], 'dpad-down':[0,1], 'dpad-left':[-1,0], 'dpad-right':[1,0] };
let touchInterval = null;
Object.entries(dpadBtnMap).forEach(([id,dir])=>{
    const btn = document.getElementById(id); if (!btn) return;
    const startMove = ()=>{ tryMove(...dir); touchInterval = setInterval(()=>tryMove(...dir), 150); };
    const stopMove = ()=>{ clearInterval(touchInterval); touchInterval=null; };
    btn.addEventListener('touchstart', (e)=>{ e.preventDefault(); startMove(); }, {passive:false});
    btn.addEventListener('touchend', stopMove);
    btn.addEventListener('mousedown', startMove);
    btn.addEventListener('mouseup', stopMove);
    btn.addEventListener('mouseleave', stopMove);
});

loadSettings();
init();
gameLoop();
</script>
