<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digger - Gem Hunt</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background-color: #1a252f;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #4a6fa5;
            min-width: 180px;
            z-index: 10;
        }

        #ui h1 {
            margin: 0 0 8px 0;
            font-size: 20px;
            color: #f0c040;
            text-shadow: 0 0 8px #f0c040;
        }
        #ui .highscore {
            font-size: 11px;
            color: #7f8c8d;
            margin-top: 2px;
        }

        #ui .stat {
            font-size: 13px;
            margin: 3px 0;
        }

        #fuel-bar-container {
            margin-top: 6px;
            background: #333;
            border-radius: 4px;
            height: 10px;
            width: 100%;
            border: 1px solid #555;
        }

        #fuel-bar {
            height: 100%;
            background: linear-gradient(90deg, #e74c3c, #f39c12, #2ecc71);
            border-radius: 4px;
            transition: width 0.1s;
        }

        #inventory {
            margin-top: 8px;
            font-size: 12px;
            color: #bdc3c7;
            max-width: 200px;
            word-wrap: break-word;
        }

        canvas {
            background-color: #0a0a0a;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            image-rendering: pixelated;
        }

        /* Game Over Overlay */
        #overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }

        #overlay.visible {
            display: flex;
        }

        #overlay h2 {
            font-size: 48px;
            color: #e74c3c;
            text-shadow: 0 0 20px #e74c3c;
            margin: 0 0 10px 0;
        }

        #overlay .final-score {
            font-size: 24px;
            color: #f0c040;
            margin-bottom: 20px;
        }

        #overlay .gems-found {
            font-size: 16px;
            color: #bdc3c7;
            margin-bottom: 30px;
        }

        #restart-btn {
            padding: 14px 36px;
            font-size: 18px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        #restart-btn:hover {
            background: #2ecc71;
            transform: scale(1.05);
        }

        #restart-btn:active {
            transform: scale(0.97);
        }

        #controls-hint {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.6);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 11px;
            color: #7f8c8d;
            z-index: 10;
        }

        /* Shop Overlay */
        #shop-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }
        #shop-overlay.visible { display: flex; }
        #shop-overlay h2 {
            font-size: 32px;
            color: #f0c040;
            text-shadow: 0 0 10px #f0c040;
            margin: 0 0 6px 0;
        }
        #shop-overlay .shop-subtitle {
            font-size: 14px;
            color: #95a5a6;
            margin-bottom: 20px;
        }
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-width: 520px;
            width: 100%;
            padding: 0 20px;
        }
        .shop-item {
            background: rgba(255,255,255,0.07);
            border: 1px solid #4a6fa5;
            border-radius: 8px;
            padding: 14px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        .shop-item:hover:not(.disabled) {
            background: rgba(255,255,255,0.14);
            border-color: #f0c040;
        }
        .shop-item.disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .shop-item .item-name {
            font-size: 15px;
            font-weight: bold;
            color: #ecf0f1;
        }
        .shop-item .item-desc {
            font-size: 12px;
            color: #95a5a6;
            margin: 4px 0 8px 0;
        }
        .shop-item .item-cost {
            font-size: 13px;
            color: #f0c040;
        }
        .shop-item .item-level {
            font-size: 11px;
            color: #7f8c8d;
            float: right;
        }
        #shop-close-btn {
            margin-top: 20px;
            padding: 10px 30px;
            font-size: 15px;
            background: #c0392b;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #shop-close-btn:hover { background: #e74c3c; }
        #shop-score-display {
            font-size: 16px;
            color: #f0c040;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h1>⛏ Digger</h1>
        <div class="stat">Score: <span id="score">0</span></div>
        <div class="highscore">Best: <span id="ui-highscore">0</span></div>
        <div class="stat">Depth: <span id="depth">0</span>m</div>
        <div class="stat">Fuel:</div>
        <div id="fuel-bar-container">
            <div id="fuel-bar" style="width:100%"></div>
        </div>
        <div id="inventory">Gems: None</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="overlay">
        <h2>⛽ Out of Fuel!</h2>
        <div class="final-score">Final Score: <span id="final-score">0</span></div>
        <div id="high-score-display" style="font-size:15px;color:#95a5a6;margin-bottom:8px;"></div>
        <div class="gems-found" id="gems-found"></div>
        <button id="restart-btn">⛏ Dig Again</button>
    </div>

    <div id="controls-hint">Arrow Keys / D-Pad &nbsp;|&nbsp; ⛽ = Fuel &nbsp;|&nbsp; 🏠 = Base &nbsp;|&nbsp; 🌋 = Lava (avoid!)</div>

    <!-- Mobile D-Pad -->
    <div id="dpad" style="position:absolute;bottom:40px;left:50%;transform:translateX(-50%);display:grid;grid-template-columns:50px 50px 50px;grid-template-rows:50px 50px 50px;gap:4px;z-index:15;user-select:none;">
        <div></div>
        <button id="dpad-up" style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);border-radius:8px;color:white;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;">▲</button>
        <div></div>
        <button id="dpad-left" style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);border-radius:8px;color:white;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;">◀</button>
        <div style="background:rgba(255,255,255,0.05);border-radius:8px;"></div>
        <button id="dpad-right" style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);border-radius:8px;color:white;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;">▶</button>
        <div></div>
        <button id="dpad-down" style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);border-radius:8px;color:white;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;">▼</button>
        <div></div>
    </div>

    <!-- Shop Overlay -->
    <div id="shop-overlay">
        <h2>🏠 Surface Base</h2>
        <div class="shop-subtitle">Spend your score to upgrade your drill!</div>
        <div id="shop-score-display">Score: <span id="shop-score">0</span></div>
        <div class="shop-grid" id="shop-grid"></div>
        <button id="shop-close-btn">⛏ Back to Digging</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const depthElement = document.getElementById('depth');
        const inventoryElement = document.getElementById('inventory');
        const fuelBar = document.getElementById('fuel-bar');
        const overlay = document.getElementById('overlay');
        const finalScoreEl = document.getElementById('final-score');
        const gemsFoundEl = document.getElementById('gems-found');
        const restartBtn = document.getElementById('restart-btn');

        // Configuration
        const TILE_SIZE = 40;
        const GRID_WIDTH = 50;
        const GRID_HEIGHT = 60;

        // Canvas size = viewport (camera scrolls)
        const VIEW_TILES_X = 20;
        const VIEW_TILES_Y = 15;
        canvas.width = VIEW_TILES_X * TILE_SIZE;
        canvas.height = VIEW_TILES_Y * TILE_SIZE;

        // Tile Types
        const TILES = {
            EMPTY:   0,
            DIRT:    1,
            STONE:   2,
            GOLD:    3,
            DIAMOND: 4,
            BEDROCK: 5,
            FUEL:    6,   // Fuel canister pickup
            BASE:    7,   // Surface base (refuel station)
            LAVA:    8,   // Hazard: damages drill
            UNSTABLE:9    // Hazard: collapses after being dug nearby
        };

        const TILE_COLORS = {
            [TILES.EMPTY]:    '#111',
            [TILES.DIRT]:     '#8b4513',
            [TILES.STONE]:    '#6b7280',
            [TILES.GOLD]:     '#ffd700',
            [TILES.DIAMOND]:  '#00e5ff',
            [TILES.BEDROCK]:  '#2d2d2d',
            [TILES.FUEL]:     '#e67e22',
            [TILES.BASE]:     '#27ae60',
            [TILES.LAVA]:     '#c0392b',
            [TILES.UNSTABLE]: '#a0522d'
        };

        const TILE_BORDER_COLORS = {
            [TILES.EMPTY]:    '#111',
            [TILES.DIRT]:     '#6b3410',
            [TILES.STONE]:    '#4b5563',
            [TILES.GOLD]:     '#b8960a',
            [TILES.DIAMOND]:  '#0099aa',
            [TILES.BEDROCK]:  '#1a1a1a',
            [TILES.FUEL]:     '#a04010',
            [TILES.BASE]:     '#1a7a40',
            [TILES.LAVA]:     '#7b0000',
            [TILES.UNSTABLE]: '#6b3010'
        };

        // Gem rewards
        const GEM_REWARDS = {
            [TILES.GOLD]:    50,
            [TILES.DIAMOND]: 200
        };

        // Fuel cost per move
        const FUEL_PER_MOVE = 2;
        const FUEL_PER_STONE = 3;
        const MAX_FUEL = 200;
        const FUEL_CANISTER_AMOUNT = 40;  // How much a canister refills
        const BASE_REFUEL_AMOUNT = MAX_FUEL; // Base refuels to full

        // Upgrades definition
        const UPGRADES = [
            {
                id: 'drillPower',
                name: '⚙️ Drill Power',
                desc: 'Increases drill strength (future: break harder rock)',
                levels: [0, 1, 2, 3, 4],
                costs: [0, 100, 250, 500, 1000],
                maxLevel: 4
            },
            {
                id: 'moveSpeed',
                name: '🚀 Move Speed',
                desc: 'Drill moves faster between tiles',
                levels: [0, 1, 2, 3],
                costs: [0, 80, 200, 400],
                maxLevel: 3
            },
            {
                id: 'fuelEfficiency',
                name: '⛽ Fuel Efficiency',
                desc: 'Reduces fuel cost per move',
                levels: [0, 1, 2, 3],
                costs: [0, 120, 300, 600],
                maxLevel: 3
            },
            {
                id: 'fuelCapacity',
                name: '🛢️ Fuel Tank',
                desc: 'Increases maximum fuel capacity',
                levels: [0, 1, 2, 3],
                costs: [0, 150, 350, 700],
                maxLevel: 3
            }
        ];

        // Game State
        let grid = [];
        let player = {};
        let score = 0;
        let fuel = MAX_FUEL;
        let maxFuel = MAX_FUEL;
        let inventory = {};
        let gameOver = false;
        let shopOpen = false;
        let keys = {};
        let moveTimer = 0;
        const MOVE_DELAY = 8; // frames between moves when key held

        // Upgrade levels
        let upgradeLevels = { drillPower: 0, moveSpeed: 0, fuelEfficiency: 0, fuelCapacity: 0 };

        function getUpgradeValue(id) {
            const lvl = upgradeLevels[id];
            switch(id) {
                case 'drillPower':    return 5 + lvl * 2;       // 5,7,9,11,13
                case 'moveSpeed':     return 6 + lvl * 2;       // 6,8,10,12 px/frame
                case 'fuelEfficiency':return Math.max(1, FUEL_PER_MOVE - lvl); // 2,1,1,1
                case 'fuelCapacity':  return MAX_FUEL + lvl * 50; // 200,250,300,350
                default: return 0;
            }
        }

        function init() {
            score = 0;
            upgradeLevels = { drillPower: 0, moveSpeed: 0, fuelEfficiency: 0, fuelCapacity: 0 };
            maxFuel = getUpgradeValue('fuelCapacity');
            fuel = maxFuel;
            inventory = {};
            gameOver = false;
            shopOpen = false;
            keys = {};
            moveTimer = 0;

            // Start player near top center
            const startX = Math.floor(GRID_WIDTH / 2);
            const startY = 2;

            player = {
                x: startX * TILE_SIZE,
                y: startY * TILE_SIZE,
                targetX: startX * TILE_SIZE,
                targetY: startY * TILE_SIZE,
                gridX: startX,
                gridY: startY,
                drillPower: getUpgradeValue('drillPower'),
                moving: false,
                facing: 'down' // for drill direction visual
            };

            generateWorld();
            updateUI();
            overlay.classList.remove('visible');
        }

        function generateWorld() {
            for (let y = 0; y < GRID_HEIGHT; y++) {
                grid[y] = [];
                for (let x = 0; x < GRID_WIDTH; x++) {
                    // Bedrock border
                    if (x === 0 || x === GRID_WIDTH - 1 || y === GRID_HEIGHT - 1) {
                        grid[y][x] = TILES.BEDROCK;
                        continue;
                    }

                    // Top 2 rows are empty (surface)
                    if (y <= 1) {
                        grid[y][x] = TILES.EMPTY;
                        continue;
                    }

                    // Depth factor: 0 at top, 1 at bottom
                    const depth = (y - 2) / (GRID_HEIGHT - 3);
                    const rand = Math.random();

                    // Stone probability increases with depth
                    const stoneProbability = 0.05 + depth * 0.35;
                    // Gold probability peaks in mid-depth
                    const goldProbability = stoneProbability + 0.02 + depth * 0.06;
                    // Diamond probability increases sharply at depth
                    const diamondProbability = goldProbability + Math.max(0, (depth - 0.4) * 0.04);
                    // Fuel canisters: scattered throughout, more common near surface
                    const fuelProbability = diamondProbability + 0.015 * (1 - depth * 0.5);
                    // Lava pockets: only in deeper layers
                    const lavaProbability = fuelProbability + Math.max(0, (depth - 0.5) * 0.06);
                    // Unstable rock: mid-depth onwards
                    const unstableProbability = lavaProbability + Math.max(0, (depth - 0.2) * 0.04);

                    if (rand < stoneProbability) {
                        grid[y][x] = TILES.STONE;
                    } else if (rand < goldProbability) {
                        grid[y][x] = TILES.GOLD;
                    } else if (rand < diamondProbability) {
                        grid[y][x] = TILES.DIAMOND;
                    } else if (rand < fuelProbability) {
                        grid[y][x] = TILES.FUEL;
                    } else if (rand < lavaProbability) {
                        grid[y][x] = TILES.LAVA;
                    } else if (rand < unstableProbability) {
                        grid[y][x] = TILES.UNSTABLE;
                    } else {
                        grid[y][x] = TILES.DIRT;
                    }
                }
            }

            // Clear a small area around the player start and place the base
            const startX = Math.floor(GRID_WIDTH / 2);
            for (let dy = 0; dy <= 2; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                    const gx = startX + dx;
                    const gy = dy;
                    if (grid[gy] && gx >= 0 && gx < GRID_WIDTH) {
                        grid[gy][gx] = TILES.EMPTY;
                    }
                }
            }

            // Place the base at the surface start position (row 0)
            grid[0][startX] = TILES.BASE;
        }

        function tryMove(dx, dy) {
            if (gameOver || player.moving) return;

            const newGridX = player.gridX + dx;
            const newGridY = player.gridY + dy;

            // Bounds check
            if (newGridX < 0 || newGridX >= GRID_WIDTH || newGridY < 0 || newGridY >= GRID_HEIGHT) return;

            const targetTile = grid[newGridY][newGridX];

            // Bedrock is impassable
            if (targetTile === TILES.BEDROCK) return;

            // Determine fuel cost
            let fuelCost = getUpgradeValue('fuelEfficiency');
            if (targetTile === TILES.STONE) fuelCost += FUEL_PER_STONE;

            if (fuel <= 0) {
                triggerGameOver();
                return;
            }

            // Set facing direction
            if (dx > 0) player.facing = 'right';
            else if (dx < 0) player.facing = 'left';
            else if (dy > 0) player.facing = 'down';
            else if (dy < 0) player.facing = 'up';

            // Mine the tile if not empty
            if (targetTile !== TILES.EMPTY) {
                // Lava: impassable — damages fuel and blocks movement
                if (targetTile === TILES.LAVA) {
                    const lavaDamage = 30;
                    fuel = Math.max(0, fuel - lavaDamage);
                    showFloatingText(`-${lavaDamage} Fuel!`, newGridX, newGridY, '#e74c3c');
                    if (fuel <= 0) triggerGameOver();
                    return; // Can't move into lava
                }

                // Check drill power vs toughness
                const toughness = targetTile === TILES.STONE ? 3 : 1;
                if (player.drillPower < toughness) return; // can't drill this

                // Collect gem if applicable
                if (targetTile === TILES.GOLD || targetTile === TILES.DIAMOND) {
                    const gemName = targetTile === TILES.GOLD ? 'Gold' : 'Diamond';
                    const reward = GEM_REWARDS[targetTile];
                    score += reward;
                    inventory[gemName] = (inventory[gemName] || 0) + 1;
                }

                // Pick up fuel canister
                if (targetTile === TILES.FUEL) {
                    fuel = Math.min(maxFuel, fuel + FUEL_CANISTER_AMOUNT);
                    showFloatingText('+Fuel', newGridX, newGridY, '#e67e22');
                }

                // Base tile: refuel to full and open shop
                if (targetTile === TILES.BASE) {
                    fuel = maxFuel;
                    showFloatingText('Refuelled!', newGridX, newGridY, '#2ecc71');
                    // Move onto base
                    fuel = Math.max(0, fuel - fuelCost);
                    player.moving = true;
                    player.targetX = newGridX * TILE_SIZE;
                    player.targetY = newGridY * TILE_SIZE;
                    player.gridX = newGridX;
                    player.gridY = newGridY;
                    // Open shop after movement completes
                    setTimeout(openShop, 300);
                    return;
                }

                // Unstable rock: dig it, but trigger a cave-in around it
                if (targetTile === TILES.UNSTABLE) {
                    grid[newGridY][newGridX] = TILES.EMPTY;
                    showFloatingText('Cave-in!', newGridX, newGridY, '#e67e22');
                    triggerCaveIn(newGridX, newGridY);
                    // Consume fuel and move
                    fuel = Math.max(0, fuel - fuelCost);
                    player.moving = true;
                    player.targetX = newGridX * TILE_SIZE;
                    player.targetY = newGridY * TILE_SIZE;
                    player.gridX = newGridX;
                    player.gridY = newGridY;
                    if (fuel <= 0) setTimeout(triggerGameOver, 400);
                    return;
                }

                grid[newGridY][newGridX] = TILES.EMPTY;
            }

            // Consume fuel
            fuel = Math.max(0, fuel - fuelCost);

            // Start movement animation
            player.moving = true;
            player.targetX = newGridX * TILE_SIZE;
            player.targetY = newGridY * TILE_SIZE;
            player.gridX = newGridX;
            player.gridY = newGridY;

            if (fuel <= 0) {
                // Allow the move to complete visually, then game over
                setTimeout(triggerGameOver, 400);
            }
        }

        // Cave-in: collapse nearby empty tiles back to dirt after a delay
        function triggerCaveIn(cx, cy) {
            const radius = 2;
            const collapseTargets = [];
            for (let dy = -radius; dy <= radius; dy++) {
                for (let dx = -radius; dx <= radius; dx++) {
                    if (dx === 0 && dy === 0) continue;
                    const nx = cx + dx;
                    const ny = cy + dy;
                    if (nx < 1 || nx >= GRID_WIDTH - 1 || ny < 2 || ny >= GRID_HEIGHT - 1) continue;
                    if (grid[ny][nx] === TILES.EMPTY) {
                        collapseTargets.push({ x: nx, y: ny });
                    }
                }
            }
            // Collapse a random subset of nearby empty tiles back to dirt
            const toCollapse = collapseTargets
                .sort(() => Math.random() - 0.5)
                .slice(0, Math.floor(collapseTargets.length * 0.4));

            setTimeout(() => {
                for (const t of toCollapse) {
                    // Don't collapse the player's current tile
                    if (t.x === player.gridX && t.y === player.gridY) continue;
                    if (grid[t.y][t.x] === TILES.EMPTY) {
                        grid[t.y][t.x] = TILES.DIRT;
                    }
                }
            }, 500);
        }

        // Shop logic
        function openShop() {
            if (gameOver) return;
            shopOpen = true;
            renderShop();
            document.getElementById('shop-overlay').classList.add('visible');
        }

        function closeShop() {
            shopOpen = false;
            document.getElementById('shop-overlay').classList.remove('visible');
            // Apply upgrades to player
            player.drillPower = getUpgradeValue('drillPower');
            maxFuel = getUpgradeValue('fuelCapacity');
            fuel = Math.min(fuel, maxFuel);
        }

        function renderShop() {
            document.getElementById('shop-score').textContent = score;
            const grid = document.getElementById('shop-grid');
            grid.innerHTML = '';
            for (const upg of UPGRADES) {
                const currentLevel = upgradeLevels[upg.id];
                const isMaxed = currentLevel >= upg.maxLevel;
                const cost = isMaxed ? 0 : upg.costs[currentLevel + 1];
                const canAfford = !isMaxed && score >= cost;

                const div = document.createElement('div');
                div.className = 'shop-item' + ((!canAfford && !isMaxed) ? ' disabled' : '');

                div.innerHTML = `
                    <span class="item-level">${isMaxed ? 'MAX' : `Lv ${currentLevel}/${upg.maxLevel}`}</span>
                    <div class="item-name">${upg.name}</div>
                    <div class="item-desc">${upg.desc}</div>
                    <div class="item-cost">${isMaxed ? '✅ Maxed out' : `Cost: ${cost} pts`}</div>
                `;

                if (canAfford) {
                    div.addEventListener('click', () => {
                        score -= cost;
                        upgradeLevels[upg.id]++;
                        renderShop();
                    });
                }

                grid.appendChild(div);
            }
        }

        document.getElementById('shop-close-btn').addEventListener('click', closeShop);

        // Floating text notifications
        let floatingTexts = [];
        function showFloatingText(text, gridX, gridY, color) {
            floatingTexts.push({
                text,
                x: gridX * TILE_SIZE + TILE_SIZE / 2,
                y: gridY * TILE_SIZE,
                color: color || '#fff',
                alpha: 1.0,
                vy: -1.2,
                life: 60
            });
        }

        // High Score
        const HS_KEY = 'gemdigger_highscore';

        function triggerGameOver() {
            if (gameOver) return;
            gameOver = true;
            // Save high score
            const prevHS = parseInt(localStorage.getItem(HS_KEY) || '0', 10);
            const newHS = Math.max(score, prevHS);
            localStorage.setItem(HS_KEY, newHS);

            finalScoreEl.textContent = score;
            const hsEl = document.getElementById('high-score-display');
            if (hsEl) hsEl.textContent = score >= prevHS && score > 0 ? '🏆 New High Score!' : `High Score: ${newHS}`;

            const gemList = Object.entries(inventory)
                .map(([k, v]) => `${v}x ${k}`)
                .join(', ');
            gemsFoundEl.textContent = gemList ? `Gems collected: ${gemList}` : 'No gems collected.';
            overlay.classList.add('visible');
        }

        function updateUI() {
            scoreElement.textContent = score;
            const depthMeters = Math.max(0, player.gridY - 2) * 2;
            depthElement.textContent = depthMeters;
            const uiHS = document.getElementById('ui-highscore');
            if (uiHS) uiHS.textContent = Math.max(score, parseInt(localStorage.getItem(HS_KEY) || '0', 10));

            const fuelPct = (fuel / maxFuel) * 100;
            fuelBar.style.width = fuelPct + '%';

            // Color the fuel bar based on level
            if (fuelPct > 50) {
                fuelBar.style.background = '#2ecc71';
            } else if (fuelPct > 25) {
                fuelBar.style.background = '#f39c12';
            } else {
                fuelBar.style.background = '#e74c3c';
            }

            const gemList = Object.entries(inventory)
                .map(([k, v]) => `${v}x ${k}`)
                .join(', ');
            inventoryElement.textContent = 'Gems: ' + (gemList || 'None');
        }

        // Game Loop
        function update() {
            if (gameOver || shopOpen) return;

            // Handle held keys with delay
            if (moveTimer > 0) {
                moveTimer--;
            } else {
                if (keys['ArrowUp'])    { tryMove(0, -1); moveTimer = MOVE_DELAY; }
                if (keys['ArrowDown'])  { tryMove(0,  1); moveTimer = MOVE_DELAY; }
                if (keys['ArrowLeft'])  { tryMove(-1, 0); moveTimer = MOVE_DELAY; }
                if (keys['ArrowRight']) { tryMove( 1, 0); moveTimer = MOVE_DELAY; }
            }

            // Animate player towards target
            const SPEED = getUpgradeValue('moveSpeed');
            if (player.x !== player.targetX) {
                const dir = player.targetX > player.x ? 1 : -1;
                player.x += dir * SPEED;
                if (Math.abs(player.targetX - player.x) <= SPEED) {
                    player.x = player.targetX;
                }
            }
            if (player.y !== player.targetY) {
                const dir = player.targetY > player.y ? 1 : -1;
                player.y += dir * SPEED;
                if (Math.abs(player.targetY - player.y) <= SPEED) {
                    player.y = player.targetY;
                }
            }

            // Mark as done moving when snapped
            if (player.x === player.targetX && player.y === player.targetY) {
                player.moving = false;
            }

            updateUI();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Camera: center on player
            const camX = player.x + TILE_SIZE / 2 - canvas.width / 2;
            const camY = player.y + TILE_SIZE / 2 - canvas.height / 2;

            // Clamp camera to world bounds
            const maxCamX = GRID_WIDTH * TILE_SIZE - canvas.width;
            const maxCamY = GRID_HEIGHT * TILE_SIZE - canvas.height;
            const clampedCamX = Math.max(0, Math.min(camX, maxCamX));
            const clampedCamY = Math.max(0, Math.min(camY, maxCamY));

            ctx.save();
            ctx.translate(-clampedCamX, -clampedCamY);

            // Only draw visible tiles
            const startTileX = Math.max(0, Math.floor(clampedCamX / TILE_SIZE));
            const endTileX = Math.min(GRID_WIDTH - 1, Math.ceil((clampedCamX + canvas.width) / TILE_SIZE));
            const startTileY = Math.max(0, Math.floor(clampedCamY / TILE_SIZE));
            const endTileY = Math.min(GRID_HEIGHT - 1, Math.ceil((clampedCamY + canvas.height) / TILE_SIZE));

            for (let y = startTileY; y <= endTileY; y++) {
                for (let x = startTileX; x <= endTileX; x++) {
                    const type = grid[y][x];
                    const px = x * TILE_SIZE;
                    const py = y * TILE_SIZE;

                    // Fill
                    ctx.fillStyle = TILE_COLORS[type] || '#111';
                    ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);

                    // Border/shading for solid tiles
                    if (type !== TILES.EMPTY) {
                        ctx.strokeStyle = TILE_BORDER_COLORS[type] || '#000';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(px + 0.5, py + 0.5, TILE_SIZE - 1, TILE_SIZE - 1);
                    }

                    // Gem glow effect
                    if (type === TILES.GOLD || type === TILES.DIAMOND) {
                        ctx.save();
                        ctx.globalAlpha = 0.3 + 0.15 * Math.sin(Date.now() / 300);
                        ctx.fillStyle = type === TILES.GOLD ? '#fff8a0' : '#a0f8ff';
                        ctx.fillRect(px + 4, py + 4, TILE_SIZE - 8, TILE_SIZE - 8);
                        ctx.restore();
                    }

                    // Lava animated glow
                    if (type === TILES.LAVA) {
                        ctx.save();
                        ctx.globalAlpha = 0.4 + 0.3 * Math.sin(Date.now() / 200 + x * 0.5);
                        ctx.fillStyle = '#ff6600';
                        ctx.fillRect(px + 3, py + 3, TILE_SIZE - 6, TILE_SIZE - 6);
                        ctx.restore();
                        // Lava icon
                        ctx.save();
                        ctx.fillStyle = '#fff';
                        ctx.font = `bold ${TILE_SIZE * 0.5}px sans-serif`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('🌋', px + TILE_SIZE / 2, py + TILE_SIZE / 2);
                        ctx.restore();
                    }

                    // Unstable rock: cracked appearance
                    if (type === TILES.UNSTABLE) {
                        ctx.save();
                        ctx.strokeStyle = '#ff8c00';
                        ctx.lineWidth = 1.5;
                        ctx.globalAlpha = 0.6;
                        // Draw crack lines
                        ctx.beginPath();
                        ctx.moveTo(px + 8, py + 5);
                        ctx.lineTo(px + 20, py + 20);
                        ctx.lineTo(px + 15, py + 35);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.moveTo(px + 25, py + 8);
                        ctx.lineTo(px + 18, py + 22);
                        ctx.stroke();
                        ctx.restore();
                    }

                    // Fuel canister icon
                    if (type === TILES.FUEL) {
                        ctx.save();
                        ctx.globalAlpha = 0.85 + 0.15 * Math.sin(Date.now() / 400);
                        ctx.fillStyle = '#fff';
                        ctx.font = `bold ${TILE_SIZE * 0.55}px sans-serif`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('⛽', px + TILE_SIZE / 2, py + TILE_SIZE / 2);
                        ctx.restore();
                    }

                    // Base station icon
                    if (type === TILES.BASE) {
                        ctx.save();
                        ctx.fillStyle = '#fff';
                        ctx.font = `bold ${TILE_SIZE * 0.55}px sans-serif`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('🏠', px + TILE_SIZE / 2, py + TILE_SIZE / 2);
                        ctx.restore();
                    }
                }
            }

            // Draw floating texts
            floatingTexts = floatingTexts.filter(ft => ft.life > 0);
            for (const ft of floatingTexts) {
                ctx.save();
                ctx.globalAlpha = ft.alpha;
                ctx.fillStyle = ft.color;
                ctx.font = 'bold 13px Segoe UI, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
                ft.y += ft.vy;
                ft.life--;
                ft.alpha = ft.life / 60;
            }

            // Draw Player (Drill)
            const px = player.x + TILE_SIZE / 2;
            const py = player.y + TILE_SIZE / 2;
            const r = TILE_SIZE / 2.5;

            // Drill body
            ctx.save();
            ctx.translate(px, py);

            // Rotate based on facing direction
            const rotations = { right: 0, down: Math.PI / 2, left: Math.PI, up: -Math.PI / 2 };
            ctx.rotate(rotations[player.facing] || 0);

            // Body (circle)
            ctx.fillStyle = '#c0392b';
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fill();

            // Drill bit (triangle pointing right = forward)
            ctx.fillStyle = '#e8e8e8';
            ctx.beginPath();
            ctx.moveTo(r, 0);
            ctx.lineTo(r * 0.3, -r * 0.5);
            ctx.lineTo(r * 0.3, r * 0.5);
            ctx.closePath();
            ctx.fill();

            // Highlight
            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            ctx.beginPath();
            ctx.arc(-r * 0.2, -r * 0.3, r * 0.4, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Input Handling
        window.addEventListener('keydown', (e) => {
            if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
                e.preventDefault();
                if (!keys[e.key]) {
                    // Immediate move on first press
                    keys[e.key] = true;
                    moveTimer = 0;
                } else {
                    keys[e.key] = true;
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
            // Reset move timer so next key press is immediate
            const anyHeld = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].some(k => keys[k]);
            if (!anyHeld) moveTimer = 0;
        });

        restartBtn.addEventListener('click', () => {
            init();
        });

        // Mobile D-Pad controls
        const dpadBtnMap = {
            'dpad-up':    [0, -1],
            'dpad-down':  [0,  1],
            'dpad-left':  [-1, 0],
            'dpad-right': [ 1, 0]
        };
        let touchInterval = null;
        Object.entries(dpadBtnMap).forEach(([id, dir]) => {
            const btn = document.getElementById(id);
            if (!btn) return;
            const startMove = () => {
                tryMove(...dir);
                touchInterval = setInterval(() => tryMove(...dir), 150);
            };
            const stopMove = () => { clearInterval(touchInterval); touchInterval = null; };
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); startMove(); }, { passive: false });
            btn.addEventListener('touchend', stopMove);
            btn.addEventListener('mousedown', startMove);
            btn.addEventListener('mouseup', stopMove);
            btn.addEventListener('mouseleave', stopMove);
        });

        init();
        gameLoop();
    </script>
</body>
</html>
